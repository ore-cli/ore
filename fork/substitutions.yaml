# ore rebrand manifest -- rules as data, re-applied from scratch on every sync.
#
# Scope: the OUTWARD-FACING surface only -- what a user types, what they read, and
# where releases come from.  Everything else stays byte-identical to upstream:
# crate names, module paths, helper binaries, internal env vars, wire identifiers,
# the ChatGPT sign-in path, licences, and the package layout names that install.sh,
# DotSlash and the npm staging scripts treat as contracts.
#
# Two hard rules:
#   * In Rust, only string literals and comments are rewritten (never tokens), and
#     format placeholders inside literals are protected.
#   * An enabled rule that matches nothing fails `--apply`: a rule that has gone
#     stale against upstream text is a silent brand leak.
#
# Behaviour lives in the `delta` series, not here.  A series commit that changes
# the text a rule anchors on updates the rule in the same commit.
# `.snap` files are deliberately out of scope: rendered TUI snapshots are
# width-dependent, so they are regenerated by the assemble pass instead.

vars:
  product: ore
  # The product as a proper noun, for prose. Upstream keeps this split --
  # `codex` is the command, "Codex" is the thing -- and the UI rules below match
  # capitalized \bCodex\b precisely because it is a name there. Replacing that
  # with the bare command produced "ore can make mistakes" and "Ask ore to do
  # anything", which read as typos at the start of a sentence.
  product_name: Ore
  bin: ore
  repo_slug: ore-cli/ore
  npm_scope: "@ore-cli"
  npm_package: "@ore-cli/ore"
  brew_tap: ore-cli/homebrew-tap
  brew_formula: ore
  bundle_id: io.github.ore-cli.ore
  tag_prefix: ore-v
  releases_html: https://github.com/ore-cli/ore/releases/latest
  releases_api: https://api.github.com/repos/ore-cli/ore/releases/latest
  install_sh_url: https://github.com/ore-cli/ore/releases/latest/download/install.sh
  install_ps1_url: https://github.com/ore-cli/ore/releases/latest/download/install.ps1

engine:
  rust_literals_only: true
  skip_dirs: [.git, target, node_modules, __pycache__, .venv, venv, bazel-out, bazel-bin, bazel-testlogs, dist, build, vendor, third_party]
  skip_files: [Cargo.lock, MODULE.bazel.lock, pnpm-lock.yaml, uv.lock, package-lock.json, flake.lock, LICENSE, NOTICE]
  skip_paths:
    # Fork-authored, and it asserts ABOUT the assembled installer: it checks
    # `assertNotIn("rust-v", …)` to prove the upstream tag prefix is gone, and
    # `assertNotIn(UPSTREAM_REPO, …)` likewise. Rebranding those literals turns
    # "rust-v" into "ore-v" and inverts every assertion into one the assembled
    # tree can never satisfy. Upstream's own test_install_sh.py is NOT skipped:
    # it tests upstream's install.sh with upstream's literals, so it has to be
    # rebranded alongside the script it exercises.
    - scripts/install/test_install_ps1.py
    - fork/*
    - .github/workflows/*
    - codex-rs/login/*
    - codex-rs/agent-identity/*
    - codex-rs/workload-identity/*
    - codex-rs/app-server-protocol/*
    - codex-rs/protocol/src/auth.rs
    - codex-rs/protocol/src/prompts/*
    - codex-rs/model-provider/src/auth.rs
    - codex-rs/model-provider/src/bearer_auth_provider.rs
    - codex-rs/model-provider-info/src/lib.rs
    - codex-rs/http-client/src/chatgpt_hosts.rs
    - codex-rs/http-client/src/chatgpt_cloudflare_cookies.rs
    - codex-rs/core/config.schema.json
    - codex-rs/hooks/schema/*
    # models.json is NOT skipped -- see models-json-identity-is-ore. Its model
    # slugs, ids and wire fields are protected by the rules' own patterns,
    # which match only the identity sentence and the two display strings.
    # prompt.md and model_info.rs are NOT skipped -- see
    # prompt-identity-is-ore below. Decision 11 keeps model-facing text
    # byte-identical because the model was tuned against the behaviour it
    # describes; the three sentences rewritten there are identity claims, not
    # behaviour, and they are false for every model this fork can now reach.
    # Model-facing prompt text, byte-identical by ratified decision 11. These
    # prompts describe the upstream agent TO an OpenAI model, and the model was
    # tuned against that description; rebranding them changes behaviour and
    # makes the text false ("ore CLI is an open source project led by OpenAI",
    # "not the old ore language model built by OpenAI"). The whole prompts crate
    # and the core template trees exist to render text for models.
    - codex-rs/prompts/*
    - codex-rs/core/templates/*
    - codex-rs/core/*prompt*.md
    - codex-rs/core/src/realtime_prompt.rs
    - codex-rs/core/src/guardian/prompt.rs
    # guardian/tests.rs asserts on guardian/prompt.rs's rendered text, and that
    # prompt is skipped just above: its literals ("The Codex agent has requested
    # the following action:", "Reviewed Codex session id:") are copies of the
    # un-rebranded prompt, so rewriting them makes the tests disagree with the
    # very text they assert against. Nothing else in the file is brand text.
    - codex-rs/core/src/guardian/tests.rs
    - codex-rs/tui/prompt_for_init_command.md
    # A five-line README for a crate ore vendors and does not modify. Every
    # "Codex" in it names OpenAI's first-party product, and its issue-tracker
    # link is correct as written: bugs in this crate do belong upstream.
    # Rebranding it produced a sentence that claimed OpenAI maintains ore's
    # fork while pointing users at ore's tracker -- false in both directions.
    # The fork's OWN README, and the one file whose job includes naming upstream
    # correctly. The rebrand turned "a fork of OpenAI Codex" into "a fork of ore"
    # and repointed the attribution link at ore itself. Listed here rather than in
    # skip_files because that matches by basename and would exempt every upstream
    # README in the tree.
    - README.md
    # Same reason as README.md, and found the hard way: ui-bare-product-name
    # rewrote this file's references to UPSTREAM into references to ore itself,
    # so the security-reporting instruction read "if the bug is in code ore
    # inherited from Ore, report it to OpenAI", and the credential-handling
    # assurance claimed byte-identity with itself.
    - SECURITY.md
    - codex-rs/chatgpt/README.md
    # Test files whose upstream literals are fixtures: the exact bytes are the
    # point, so rewriting them makes the assertions test themselves.
    # info.rs: canonicalize_git_remote_url tests feed deliberately mixed-case,
    # port and scheme variants of ONE GitHub remote and assert they all fold to
    # a single string -- URL shapes under test, not repo coordinates. The rules
    # rewrote them inconsistently ("openai/codex" became the fork slug while
    # "OpenAI/Codex" and ":443/openai/codex" did not), so the variants stopped
    # converging. Cost of the skip: one doc comment keeps "Codex".
    - codex-rs/git-utils/src/info.rs
    # env_detect_tests.rs: git-remote fixtures from which the tests derive the
    # expected by-repo endpoint (".../environments/by-repo/github/openai/codex")
    # and repo hints ("openai/codex"), shapes no URL rule rewrites; rewriting
    # only the remote breaks the derivation. Nothing else in the file is brand
    # text.
    - codex-rs/cloud-tasks/src/env_detect_tests.rs
    # The fork-authored art pipeline. These scripts already say "ore" wherever
    # they mean ore; their remaining "Codex"/"OpenAI" mentions name upstream's
    # own wordmark art and screenshot, so rewriting them produces false prose
    # ("Upstream ships ten variants of the ore wordmark") -- the README problem
    # again. The baked frames carry no brand strings at all (the renderer is
    # invoked with an empty --label), and they are generated output: the
    # generator, not the rebrand, is what owns their bytes.
    - scripts/ore_art.py
    - scripts/generate-ore-frames.py
    - scripts/generate-ore-hero.py
    - codex-rs/tui/frames/ore-*
    - sdk/*
    - .codex/*
  skip_suffixes: [.png, .jpg, .jpeg, .gif, .ico, .woff, .woff2, .zip, .gz, .zst, .snap, .patch]

categories:

  # ---------------------------------------------------------------- CLI identity
  cli-identity:
    - name: clap-program-name
      note: clap renders `--version` from the command name, which defaults to the crate name (codex-cli).
      files: [codex-rs/cli/src/main.rs]
      rust_literals_only: false
      pattern: '(#\[clap\(\n    author,\n    version,)(?!\n    name = )'
      replace: '\1\n    name = "${bin}",\n    display_name = "${bin}",'

    - name: clap-bin-name
      files: [codex-rs/cli/src/main.rs]
      rust_literals_only: false
      pattern: 'bin_name = "codex"'
      replace: 'bin_name = "${bin}"'

    - name: clap-override-usage
      globs: ["codex-rs/**/*.rs"]
      rust_literals_only: false
      pattern: 'override_usage = "codex '
      replace: 'override_usage = "${bin} '

    - name: clap-override-usage-continuation
      files: [codex-rs/cli/src/main.rs]
      rust_literals_only: false
      pattern: '\\n       codex \[OPTIONS\]'
      replace: '\\n       ${bin} [OPTIONS]'

    - name: clap-subcommand-bin-name
      globs: ["codex-rs/**/*.rs"]
      rust_literals_only: false
      pattern: 'bin_name = "codex '
      replace: 'bin_name = "${bin} '

    - name: completion-command-name
      files: [codex-rs/cli/src/main.rs]
      rust_literals_only: false
      pattern: 'let name = "codex";'
      replace: 'let name = "${bin}";'

    - name: doctor-path-probe
      files: [codex-rs/cli/src/doctor.rs]
      rust_literals_only: false
      pattern: '(run_command\("where", \["|run_command\("which", \["-a", ")codex"'
      replace: '\1${bin}"'

    - name: sandbox-version-banner-probe
      note: >
        The sandboxed `--version` banner opens with the clap program name, which
        clap-program-name rebrands, so this assertion must follow; the bare lowercase
        literal matches no other rule. cargo_bin("codex") in the same test stays
        upstream on purpose: the built artifact keeps its crate name.
      files: [codex-rs/cli/tests/sandbox_cloud_config.rs]
      rust_literals_only: false
      pattern: 'starts_with\("codex"\)'
      replace: 'starts_with("${bin}")'

    - name: security-remediation-probe
      note: >
        The endpoint-protection remediation names the product, so the Codex rule
        rebrands it in security.rs; this test lowercases that string before
        comparing, and its bare lowercase literal matches no other rule. Without
        the pair the assertion compares "ore" against "codex" and fails on the
        assembled tree only -- invisible on delta, red on main.
      files: [codex-rs/cli/src/doctor/security_tests.rs]
      rust_literals_only: false
      pattern: 'verify codex exclusions'
      replace: 'verify ${product} exclusions'

  # ------------------------------------------------------- `codex <sub>` in text
  cli-command-in-text:
    - name: cli-command-in-help-text
      note: subcommand list is re-derived from `enum Subcommand` by --audit; this rule is the bulk rewrite.
      globs: ["codex-rs/**/*.rs", "codex-rs/**/*.txt", "**/*.md", "scripts/**/*.py", "scripts/**/*.sh", "codex-cli/scripts/**/*.sh", ".github/ISSUE_TEMPLATE/*.yml", ".github/**/*.md"]
      pattern: '(?<![\w./-])codex(?= (?:agents|app|app-server|apply|archive|cloud|completion|debug|delete|doctor|exec|exec-server|execpolicy|features|fork|login|logout|mcp|mcp-server|migrate-rollouts|plugin|queue|remote-control|responses-api-proxy|resume|review|sandbox|stdio-to-uds|unarchive|update)\b)'
      replace: '${bin}'

    - name: cli-command-before-flag
      note: >
        cli-command-in-help-text matches `codex ` only when a SUBCOMMAND follows, by an
        explicit lookahead list. A flag is not in that list, so every `codex -m`,
        `codex --help` and `codex --cd` survived the rebrand -- including the model
        picker's "Access legacy models by running codex -m <model_name>", which tells the
        user to run a command that does not exist, and install.ps1's
        `Get-Command codex -ErrorAction SilentlyContinue`, which probes for the wrong
        binary when deciding whether one is already installed.

        Same lookbehind as the subcommand rule, so a path, an identifier or a longer word
        ending in "codex" is left alone; the lookahead requires one or two dashes followed
        by a letter, which no path or identifier produces.
      globs: ["codex-rs/**/*.rs", "codex-rs/**/*.txt", "**/*.md", "scripts/**/*.py", "scripts/**/*.sh", "scripts/**/*.ps1", "codex-cli/scripts/**/*.sh", ".github/ISSUE_TEMPLATE/*.yml", ".github/**/*.md"]
      pattern: '(?<![\w./-])codex(?= -{1,2}[a-zA-Z])'
      replace: '${bin}'

    - name: cli-command-in-backticks
      globs: ["codex-rs/**/*.rs", "**/*.md"]
      pattern: '`codex`'
      replace: '`${bin}`'

    - name: cli-command-before-subcommand-placeholder
      note: >
        `codex {subcommand}` in error messages. Placeholder protection splits the
        literal at {subcommand}, so cli-command-in-help-text's subcommand lookahead
        can never see the word that follows; rewritten as a raw-text rule that names
        the placeholder in the pattern instead.
      files: [codex-rs/cli/src/main.rs]
      rust_literals_only: false
      pattern: '`codex \{subcommand\}`'
      replace: '`${bin} {subcommand}`'

  # ------------------------------------------------------------- display strings
  display-strings:
    - name: prompt-identity-is-ore
      note: >
        Decision 11 keeps model-facing prompt text byte-identical, on two grounds: the
        model was tuned against the description, and rebranding makes the text false
        ("ore CLI is an open source project led by OpenAI"). Both are about the wrong
        thing here. The tuning argument is about the ~200 lines of BEHAVIOUR, none of
        which these rules touch -- they rewrite three identity sentences and nothing
        else. And the falseness argument inverts the moment a non-OpenAI model reads
        it: telling Claude it is "Codex, a coding agent based on GPT-5" running "a
        project led by OpenAI" is false three times over, and users see it the first
        time they ask the agent who it is.

        Clause-level rather than word-level, exactly because a bare Codex -> ore would
        produce the false sentences decision 11 warned about. The lead-in
        "You are a coding agent running in the Codex CLI" is rewritten whole, so what
        replaces it is a true statement rather than a substituted noun.

        The replacement deliberately contains no "Codex": ui-bare-product-name runs
        after this and would rewrite it, turning "forked from Codex" into "forked from
        Ore". The lineage belongs in the README, not in a sentence whose meaning
        depends on rule ordering.
      files: [codex-rs/models-manager/prompt.md]
      rust_literals_only: false
      pattern: 'You are a coding agent running in the Codex CLI, a terminal-based coding assistant\. Codex CLI is an open source project led by OpenAI\. You are expected to be precise, safe, and helpful\.'
      replace: 'You are a coding agent running in ${product_name}, a terminal-based coding assistant. ${product_name} is an open source coding agent. You are expected to be precise, safe, and helpful.'

    - name: prompt-drops-the-old-model-disambiguation
      note: >
        The second half of prompt-identity-is-ore. Upstream disambiguates its CLI from
        OpenAI's retired Codex language model, which is a distinction only OpenAI needs
        to draw; for ore the parenthetical is noise, and rebranding it word-wise yields
        "not the old ore language model built by OpenAI", which is meaningless.
      files: [codex-rs/models-manager/prompt.md]
      rust_literals_only: false
      pattern: 'Within this context, Codex refers to the open-source agentic coding interface \(not the old Codex language model built by OpenAI\)\.'
      replace: 'Within this context, ${product_name} refers to the open-source agentic coding interface.'

    - name: prompt-personality-header-is-ore
      note: >
        DEFAULT_PERSONALITY_HEADER, the other half of what the agent is told it is.
        "based on GPT-5" is the one clause where the provider genuinely matters: true
        for an OpenAI model, false for Claude. Dropped rather than made conditional --
        a substitution cannot branch on provider, and the base model is not something
        the agent needs told to behave correctly.
      files: [codex-rs/models-manager/src/model_info.rs]
      pattern: 'You are Codex, a coding agent based on GPT-5\.'
      replace: 'You are ${product_name}, a coding agent.'

    - name: ui-app-name-label
      note: >
        The other half of ui-bare-lowercase-label. That rule fixed the VALUE the
        terminal-title "app name" item renders (was the literal `codex`); the LABEL beside
        it still said "Codex app name", protected by the deliberate `app` exclusion on
        ui-bare-product-name. Here "Codex app" is this CLI, not OpenAI's desktop app, so
        the exclusion is wrong for this one string and right everywhere else -- hence a
        file-scoped rule rather than a change to the general lookahead.
      files: [codex-rs/tui/src/bottom_pane/title_setup.rs]
      pattern: 'Codex app name'
      replace: '${product_name} app name'

    - name: tooltip-drops-the-disabled-feedback-command
      note: >
        `/feedback` is hard-disabled in ore -- Config.feedback_enabled is false
        for every layer by the telemetry-feedback-off seam -- so the tip told
        users to run a command that answers "disabled". Emptied rather than
        reworded: tooltips.rs filters empty lines out of the rotation, so the
        line disappears without disturbing the file's shape or the surrounding
        indices.
      files: [codex-rs/tui/tooltips.txt]
      rust_literals_only: false
      pattern: '(?m)^Use /feedback to send logs to the maintainers when something looks off\.$'
      replace: ''

    - name: tooltip-points-at-ore-community-not-openai-s
      note: >
        Upstream points users at OpenAI's Discord and at the Codex category of
        OpenAI's forum. Rebranded, the forum line became "Visit the Ore community
        forum" pointing at community.openai.com/c/codex -- claiming OpenAI's
        forum as ore's, which is both untrue and rude to the people who run it.
        The Discord line keeps its shape and gets ore's own server; the forum
        line is emptied because ore has no forum to send anyone to.
      files: [codex-rs/tui/tooltips.txt]
      rust_literals_only: false
      pattern: '(?m)^Join the OpenAI community Discord: http://discord\.gg/openai$'
      replace: 'Join the ${product_name} community Discord: https://discord.gg/awN2xANFMW'

    - name: tooltip-drops-the-forum-that-is-not-ours
      note: >
        See tooltip-points-at-ore-community-not-openai-s. Matches either spelling
        because ui-bare-product-name may rewrite Codex to Ore before this runs.
      files: [codex-rs/tui/tooltips.txt]
      rust_literals_only: false
      pattern: '(?m)^Visit the (?:Codex|Ore) community forum: https://community\.openai\.com/c/codex/37$'
      replace: ''

    - name: tooltip-claims-no-plan-that-does-not-exist
      note: >
        Upstream shows ChatGPT Free and Go accounts "For a limited time, Codex is
        included in your plan for free". Rebranded word-for-word that becomes
        "Ore is included in your plan", which is false: ore is a fork, it is not
        sold, and nothing about it is included in anyone's subscription. It is
        also the one claim the rest of the fork is careful never to make -- the
        README, the sign-in section and the NOTICE all go out of their way to say
        ore is not affiliated with OpenAI, and then the TUI greeted free-plan
        users by implying a commercial relationship.

        Replaced with the wording the same file already uses for every other
        account type, rather than deleted, so the tooltip rotation keeps its
        shape and the constant stays where a sync can still see it. Matches
        either spelling because ui-bare-product-name may have rewritten Codex to
        Ore before this rule runs.
      files: [codex-rs/tui/src/tooltips.rs]
      pattern: 'For a limited time, (?:Codex|Ore) is included in your plan for free – let\u2019s build together\.'
      replace: 'Build faster with ${product_name}.'

    - name: ui-bare-lowercase-label
      note: >
        A blind spot between the two existing families: ui-bare-product-name matches the
        capitalized noun, and the cli-command rules match `codex ` followed by a
        subcommand or a flag. A standalone lowercase `"codex"` literal used as a LABEL is
        neither, so it survived both.

        Found by running the binary: `ore exec` printed `codex` above every assistant
        turn -- directly above a reply that correctly said "Ore" -- from
        event_processor_with_human_output.rs. The status-surface preview had the same
        shape: the terminal-title picker offers an "app name" item whose rendered value
        was the literal `codex`.

        Scoped to the three files rather than applied globally, because a bare `"codex"`
        elsewhere is usually an executable name, a directory, a pet id or a test fixture,
        and rewriting those breaks things. Deliberately NOT applied to the originator:
        `codex_exec` and DEFAULT_ORIGINATOR are wire-visible client identity, and
        DEFAULT_ORIGINATOR lives in codex-rs/login, inside the ratified auth fence.
      files:
        - codex-rs/exec/src/event_processor_with_human_output.rs
        - codex-rs/tui/src/bottom_pane/status_surface_preview.rs
      # Raw text, not literal-contents: the quotes are the anchor that keeps this
      # from matching `codex` inside a longer literal such as a path or a slug.
      rust_literals_only: false
      pattern: '"codex"'
      replace: '"${bin}"'

    - name: git-attribution-is-ore
      note: >
        ore instructs the agent to end commit messages with
        `Co-authored-by: Codex <noreply@openai.com>` and PR bodies with
        `Generated with [Codex](https://openai.com/codex/).` ui-bare-product-name renamed
        the display half and left the address and the link, so ore was writing
        "Co-authored-by: Ore <noreply@openai.com>" into users' git history and OpenAI's
        marketing URL into their pull requests -- attributing the user's work to a company
        that had no part in it, in a commit trailer that outlives the session.

        Rewritten as whole literals so the address and URL move with the name. The
        matching predicate at the bottom of the same file is rewritten by the same rules,
        so what the agent is told to write and what the checker accepts stay in step.
      # Globs, not one file. Scoping this to world_state.rs fixed 3 of 8 sites and
      # left the other 5 saying `Co-authored-by: Ore <noreply@openai.com>` -- so the
      # agent was told to write one trailer while the checkers and tests asserted
      # another, and app-server's git_attribution suite failed on the mismatch. The
      # pattern is the whole literal, so no unrelated openai.com reference matches.
      globs: ["codex-rs/**/*.rs", "codex-rs/**/*.md", "**/*.md"]
      pattern: 'Co-authored-by: Codex <noreply@openai\.com>'
      replace: 'Co-authored-by: ${product_name} <noreply@ore-cli.github.io>'

    - name: git-attribution-link-is-ore
      note: >
        The pull-request half of git-attribution-is-ore.
      globs: ["codex-rs/**/*.rs", "codex-rs/**/*.md", "**/*.md"]
      pattern: 'Generated with \[Codex\]\(https://openai\.com/codex/\)'
      replace: 'Generated with [${product_name}](https://github.com/${repo_slug})'

    - name: models-json-identity-is-ore
      note: >
        The other half of prompt-identity-is-ore, and the half that mattered most: an
        adversarial run of the shipped binary found that every OpenAI-provider model still
        opened with "You are Codex, a coding agent based on GPT-5." Only the Anthropic
        catalog had been fixed, because these five templates live in models.json rather
        than in prompt.md, and models.json was skipped wholesale.

        Same reasoning as decision 11's narrowing: the identity sentence is not the
        behaviour the model was tuned against, and it is the first thing a user sees when
        they ask the agent what it is. "based on GPT-5" is dropped rather than kept,
        because the sentence is shared by models that are not GPT-5 and a substitution
        cannot branch on the slug.

        The pattern is anchored to the full sentence, so nothing else in this JSON --
        slugs, ids, wire field names -- is reachable by it.
      files: [codex-rs/models-manager/models.json]
      rust_literals_only: false
      pattern: 'You are Codex, an? (?:coding )?agent based on GPT-5\.'
      replace: 'You are ${product_name}, a coding agent.'

    - name: test-constant-tracks-the-rebranded-identity
      note: >
        codex-app-server's thread_resume suite hardcodes the gpt-5.2 instructions
        opening as a &str constant and asserts the resumed thread's instructions
        still contain it. models-json-identity-is-ore rewrites that same sentence
        in models.json, which is where the runtime template actually comes from,
        so on an assembled tree the two sides disagree and
        thread_resume_accepts_personality_override fails -- while passing on the
        series, where no substitution has run. That split is why it went
        unnoticed: ore-ci tests delta unsubstituted.

        Rewriting the constant keeps the test doing its real job -- asserting a
        personality override does not displace the base instructions -- instead of
        retiring it into known-failing, which is scoped to the telemetry seams and
        would silently drop the coverage. Same pattern and replacement as the
        models.json rule so the two cannot drift; rust_literals_only stays at its
        default, so only the string literal's contents are reachable.
      files: [codex-rs/app-server/tests/suite/v2/thread_resume.rs]
      pattern: 'You are Codex, an? (?:coding )?agent based on GPT-5\.'
      replace: 'You are ${product_name}, a coding agent.'

    - name: models-json-remaining-product-name
      note: >
        models-json-identity-is-ore rewrote the seven instructions_template openings, and
        round 2 found ten more "Codex" in the same file that ui-bare-product-name could
        never reach, because its globs cover *.rs and *.md but not *.json. Three of them
        are in the SAME templates -- "As Codex, you are an excellent communicator" three
        paragraphs below a line now reading "You are Ore" -- so the narrow fix created a
        contradiction in model-facing text that was at least self-consistent before.

        Two more are user-visible: an availability notice with visibility=list, and the
        upgrade migration_markdown that model_migration.rs renders in the TUI. Lowercase
        slugs (codex-auto-review) are untouched: the pattern is the capitalized noun.
      files: [codex-rs/models-manager/models.json]
      rust_literals_only: false
      # `\b` cannot match after a literal \n escape: in the file those are the two
      # characters backslash and `n`, and `n` is a word character, so the boundary
      # never exists. That is why "...is no longer available\n\nCodex now uses..."
      # -- migration text the TUI renders -- survived a plain \bCodex\b.
      pattern: '(?:(?<=\\n)|(?<![A-Za-z0-9_]))Codex\b'
      replace: '${product_name}'

    - name: update-command-fails-on-a-failed-download
      note: >
        `ore update` printed "Update ran successfully!" and exited 0 after the download
        404'd. The command is a pipeline -- curl into sh -- and a shell pipeline reports
        the exit status of its LAST stage, so a failed curl writes nothing, the trailing
        sh reads empty stdin and exits 0, and main.rs's `if !status.success()` check sees
        success. Upstream's bug, but it bites this fork constantly: releases/latest does
        not resolve to a prerelease, so the download 404s for the whole prerelease line,
        and the startup update check makes the path live.

        Fixed where the string is built rather than where the status is read, so no
        upstream .rs file changes.

        NOT with `set -o pipefail`: an earlier version of this rule used it and broke the
        command outright on Debian and Ubuntu, where /bin/sh is dash. dash rejects that
        option, `set` is a POSIX special builtin so the failure aborts the whole `sh -c`
        string, and curl never ran at all -- exit 2, every time, on the bulk of standalone
        Unix installs. Downloading to a file and running it with `&&` needs no shell
        options and gives the exit status of whichever half failed.
      files: [codex-rs/tui/src/update_action.rs]
      # The `-o` guard keeps this idempotent: substitute.py --check applies twice
      # and requires a fixed point.
      # Naturally idempotent: the replacement contains no `| ... sh` pipeline for
      # this pattern to match on a second pass.
      pattern: 'curl -fsSL (?P<url>\S+) \| CODEX_NON_INTERACTIVE=1 sh'
      replace: 'curl -fsSL \g<url> -o \"${TMPDIR:-/tmp}/ore-install.sh\" && CODEX_NON_INTERACTIVE=1 sh \"${TMPDIR:-/tmp}/ore-install.sh\"'

    - name: config-home-in-help-text
      note: >
        Every subcommand's `--help` told users their config lives in
        `~/.codex/config.toml`. It does not: find_codex_home() resolves ORE_HOME, then
        CODEX_HOME, then ~/.ore, and the installer and `ore doctor` both say ~/.ore. The
        old path is still read as a compatibility layer, so this is a wrong default in
        the docs rather than a broken path -- but it is 26 subcommands' worth of wrong,
        and it leaks into the generated shell completions too.

        Anchored to `~/.codex` specifically. A bare `.codex/` is left alone on purpose:
        a project-local .codex/ directory keeps its name, because it is baked into the
        sandbox policy.
      globs: ["codex-rs/**/*.rs", "codex-rs/**/*.txt", "**/*.md"]
      # These two describe the LEGACY codex home that ore layers underneath its
      # own; rewriting them makes the compatibility documentation say ore is
      # layered under ore.
      exclude:
        - codex-rs/config/src/loader/mod.rs
        - codex-rs/fork-invariants/tests/suite/config_layering.rs
      rust_literals_only: false
      pattern: '~/\.codex/'
      replace: '~/.${bin}/'

    - name: ui-openai-codex
      globs: ["codex-rs/**/*.rs", "**/*.md", "*.nix", "codex-rs/**/*.nix"]
      pattern: 'OpenAI Codex'
      replace: '${product_name}'

    - name: ui-codex-cli-name
      globs: ["codex-rs/**/*.rs", "**/*.md", "codex-cli/**/*.json", "codex-cli/**/*.py", "codex-cli/**/*.js"]
      pattern: '\bCodex CLI\b'
      replace: '${product_name} CLI'

    - name: ui-tagline
      globs: ["codex-rs/**/*.rs", "**/*.md"]
      pattern: "OpenAI's command-line coding agent"
      replace: 'a command-line coding agent'

    - name: logout-names-the-account-not-the-product
      note: >
        "/logout" ends the signed-in session: logout_with_revoke revokes the token with
        the auth provider and clears the stored credential. You log out OF a service, and
        ore is not one -- "log out of ore" describes something that does not exist. Naming
        the account instead is also the only phrasing that stays true across ore's auth
        modes, which now include an API key and Anthropic as well as ChatGPT sign-in.
        Ordered before ui-bare-product-name so it matches the upstream literal.
      files: [codex-rs/tui/src/slash_command.rs]
      pattern: 'log out of Codex'
      replace: 'log out of your account'

    - name: installer-home-matches-the-resolver
      note: >
        The installers defaulted to ~/.codex while the binary resolves its home with
        find_codex_home(): ORE_HOME, then CODEX_HOME as a full alias, then ~/.ore. So a
        standalone install landed where nothing looks for it -- install-context checks
        that the running exe sits under <home>/packages/standalone/releases, and the
        app-server daemon resolves its managed binary the same way, so both silently
        stopped recognising a managed install. Decision 14 keeps the CODEX_* env NAMES,
        which this preserves; it is the default PATH that has to follow the home.
      files: [scripts/install/install.sh]
      rust_literals_only: false
      pattern: 'CODEX_HOME_DIR="\$\{CODEX_HOME:-\$HOME/\.codex\}"'
      replace: 'CODEX_HOME_DIR="${ORE_HOME:-${CODEX_HOME:-$HOME/.ore}}"'

    - name: installer-ps1-home-matches-the-resolver
      note: >
        The install.ps1 counterpart of installer-home-matches-the-resolver, and it
        has to rewrite the whole resolution rather than only the default path.
        Rewriting just `.codex` to `.ore` left the script consulting CODEX_HOME
        alone, so a Windows user who set ORE_HOME -- the variable find_codex_home()
        prefers, and the one the README tells people to use -- got a standalone
        install staged under ~/.ore while the CLI looked under $ORE_HOME. That is
        the silent unrecognised-install failure the install.sh rule above exists to
        prevent; it survived here because the rule name claimed a parity its pattern
        did not deliver. Decision 14 keeps the CODEX_* env NAMES, which this
        preserves: ORE_HOME goes ahead of CODEX_HOME, the order the resolver uses.
      files: [scripts/install/install.ps1]
      rust_literals_only: false
      pattern: '\$codexHome = if \(\[string\]::IsNullOrWhiteSpace\(\$env:CODEX_HOME\)\) \{\n    Join-Path \$env:USERPROFILE "\.codex"\n\} else \{\n    \$env:CODEX_HOME\n\}'
      replace: "$oreHome = if ([string]::IsNullOrWhiteSpace($env:ORE_HOME)) { $env:CODEX_HOME } else { $env:ORE_HOME }\n$codexHome = if ([string]::IsNullOrWhiteSpace($oreHome)) {\n    Join-Path $env:USERPROFILE \".ore\"\n} else {\n    $oreHome\n}"

    - name: installer-tells-you-to-run-ore
      note: >
        install.sh links exactly one visible command, `ore` (BIN_PATH="$BIN_DIR/ore"), and then
        signed off with "Future terminals: open a new terminal and run: codex" -- a command the
        install it just finished does not provide. Eight of these across the four PATH cases,
        plus "PATH order will determine which codex runs" in the conflict warning, where the
        same sentence already says "ore" one clause earlier.

        `printf 'codex\n'` is the other half of release_codex_relative_path, whose `bin/codex`
        branch was rebranded to `bin/ore` because it carried the `bin/` prefix a path-shaped
        rule could see. The bare fallback names the legacy npm layout's entrypoint, which
        install_legacy_release stages as "$stage_release/ore" and release_dir_is_complete
        checks as "$release_dir/ore" -- so update_visible_command would have pointed the
        symlink at a file that is not there. Latent today (npm is dormant until Windows), wrong
        whenever it wakes.

        Deliberately untouched: codex-package_SHA256SUMS and codex-package-<target>.tar.gz are
        real asset names, and the CODEX_* environment variables are decision 14.
      files: [scripts/install/install.sh]
      rust_literals_only: false
      pattern: '(?P<lead>&& |run: |terminal: |which )codex(?P<tail>"|\\n'"'"'| runs)'
      replace: '\g<lead>ore\g<tail>'

    - name: installer-legacy-entrypoint-fallback-is-ore
      note: >
        The other half of release_codex_relative_path. Its `bin/codex` branch carried a `bin/`
        prefix and was rebranded; this bare fallback was not, so for the legacy npm layout it
        returned "codex" while install_legacy_release had staged the binary as
        "$stage_release/ore" -- update_visible_command would have symlinked a path that does not
        exist. Separate from installer-tells-you-to-run-ore because the literal contains both a
        quote and a backslash-n, which the other rule's alternation cannot carry.
      files: [scripts/install/install.sh]
      rust_literals_only: false
      pattern: '(?P<lead>printf .)codex(?P<tail>\\n)'
      replace: '\g<lead>ore\g<tail>'

    - name: installer-test-bundle-entrypoint-is-ore
      note: >
        test_install_sh.py builds fake release bundles for install.sh to consume, and it built
        them with a `bin/codex` entrypoint. The real bundles carry `bin/ore` -- targets.py sets
        executable_stem="ore", and ore-release's tag-check greps for exactly that -- so the
        substituted install.sh chmods `bin/ore`, finds nothing, and all 17 tests fail with
        "chmod: .../bin/ore: No such file or directory". The literal is split across Path
        components (`/ "bin" / "codex"`), so no path-shaped rule can see it.

        Only the packaged entrypoint moves. `codex-path/`, `codex-package.json`,
        `bin/codex-code-mode-host` and the asset stem `codex-package-<target>.tar.gz` are the
        names the real assets actually use, and the legacy npm layout keeps
        `vendor/<target>/codex/codex`: install.sh reads that path unchanged and copies it out
        to `ore`. Rebranding any of those would make the fixture describe a bundle that does
        not exist.
      files: [scripts/install/test_install_sh.py]
      rust_literals_only: false
      pattern: '(?P<lead>(?:install_bin|package_dir|current) / (?:"bin" / )?)"codex"'
      replace: '\g<lead>"ore"'

    - name: ui-bare-product-name
      note: >
        Rust literals/comments only; the auth fence and wire identifiers are skipped wholesale above.
        The lookahead protects the phrases where "Codex" names OpenAI's service rather than this CLI
        (the ChatGPT backend, the desktop app, the IDE extension, Codex Cloud) -- rebranding those
        would make the text false.  The lookbehind protects a system prompt's opening line wherever
        it is COPIED: the prompt files themselves are skipped above, but test fixtures embed the
        same text, and a fixture that says "You are ore" while the prompt says "You are Codex" is a
        test that fails for the right reason in the most confusing possible way.
      globs: ["codex-rs/**/*.rs", "codex-rs/**/*.js", "codex-rs/**/*.toml", "codex-rs/**/*.txt", "codex-cli/**/*.js", "codex-cli/**/*.json", "**/*.md", "scripts/**/*.py", "scripts/**/*.sh", "scripts/install/*"]
      exclude: ["codex-rs/tui/src/pets/*"]
      # `(?<!OpenAI\.)` and the artifact suffixes protect names that identify
      # OpenAI's DESKTOP APP, not this CLI: the MSIX identity OpenAI.Codex, the
      # Codex.dmg / Codex-latest-x64.dmg download URLs, and the Codex/Logs
      # directory. Rebranding those does not rename anything -- it produces a
      # package name, a URL and a path that match no installation that exists.
      pattern: '(?<!You are )(?<!OpenAI\.)(?<!X-OpenAI-Internal-)(?<!/Volumes/)\bCodex\b(?! (?:backend|app(?![a-z-])|App|extension|Extension|[Cc]loud))(?!\.dmg)(?!\.app)(?!-latest)(?!/Logs)'
      replace: '${product_name}'

    - name: article-before-product-name
      globs: ["codex-rs/**/*.rs", "**/*.md"]
      # Case-preserving: sentence-initial "A Ore" is the same defect and was missed.
      pattern: '\b(?P<a>[Aa]) (?P<w>Ore\b)'
      replace: '\g<a>n \g<w>'

    - name: ui-docs-link-probe-range
      note: >
        chatgpt_success_message_renders_osc8_hyperlinks measures the "Codex docs"
        hyperlink cell-by-cell -- 27 dim prefix cells, then the underlined link.
        "ore docs" is 8 columns where "Codex docs" was 10, so the probed range
        (27+10) and the run length shrink with it (precedent:
        installer-ps1-prefix-length).
      files: [codex-rs/tui/src/onboarding/auth.rs]
      rust_literals_only: false
      pattern: '\(0\.\.37\)'
      replace: '(0..35)'

    - name: ui-docs-link-probe-width
      files: [codex-rs/tui/src/onboarding/auth.rs]
      rust_literals_only: false
      pattern: 'Modifier::UNDERLINED; 10\]'
      replace: 'Modifier::UNDERLINED; 8]'

    - name: migration-rewrite-target-fixture
      note: >
        external-agent-migration/src/rewrite.rs maps external-agent terms to the
        product name (rebranded to "ore" by ui-bare-product-name), and this fixture
        holds the expected rewritten AGENTS.md bytes. Between \n escapes the
        escape's own "n" is a word character, so ui-bare-product-name's \bCodex\b
        never fires on the middle occurrences; this rule covers exactly that shape.
      files: [codex-rs/external-agent-migration/src/service_tests/general/repo_import.rs]
      pattern: '(?<=\\n)Codex(?=\\n)'
      replace: '${product_name}'

  # ------------------------------------------------------------------------ URLs
  urls:
    - name: github-repo-url
      globs: ["codex-rs/**/*.rs", "codex-cli/**/*.js", "codex-cli/**/*.json", "**/*.md", "scripts/**/*.py", "scripts/install/*", ".github/ISSUE_TEMPLATE/*.yml"]
      pattern: 'github\.com/openai/codex'
      replace: 'github.com/${repo_slug}'

    - name: rusty-v8-mirror-tag
      note: >
        ore mirrors upstream's rusty_v8 prebuilts into its own releases, tagged
        ore-rusty-v8-v* so they match the ore-* push allowlist and do not match
        upstream's rusty-v8-v*.*.* trigger glob. Pairs with rusty-v8-mirror-url:
        the tag prefix and the repo slug have to move together or the download
        404s. .github/actions/ is in substitution scope; .github/workflows/ is not.
      files: [.github/actions/setup-rusty-v8/action.yml]
      pattern: 'release_tag="rusty-v8-v'
      replace: 'release_tag="ore-rusty-v8-v'

    - name: rusty-v8-mirror-url
      note: >
        The other half of rusty-v8-mirror-tag. Scoped to the action rather than
        widening github-repo-url's globs, because other .github/ files reference
        upstream deliberately.
      files: [.github/actions/setup-rusty-v8/action.yml]
      pattern: 'https://github\.com/openai/codex/releases/download/'
      replace: 'https://github.com/${repo_slug}/releases/download/'

    - name: github-api-repo-url
      globs: ["codex-rs/**/*.rs", "scripts/**/*.py", "scripts/install/*"]
      pattern: 'api\.github\.com/repos/openai/codex'
      replace: 'api.github.com/repos/${repo_slug}'

    - name: raw-github-url
      globs: ["codex-rs/**/*.rs", "**/*.md"]
      pattern: 'raw\.githubusercontent\.com/openai/codex'
      replace: 'raw.githubusercontent.com/${repo_slug}'

    - name: developer-docs-url
      note: >
        The trailing path is consumed deliberately. docs/ deep-links into upstream's CLI
        documentation (slash-commands, features), and those pages describe behaviour ore
        does not ship -- analytics on, ~/.codex as the home, a desktop app subcommand.
        Sending ore's users there is worse than sending them to ore's own README.
      globs: ["codex-rs/**/*.rs", "**/*.md"]
      pattern: 'https://developers\.openai\.com/codex/cli[^\s)\]]*'
      replace: 'https://github.com/${repo_slug}#install'

    - name: hosted-install-sh-url
      globs: ["codex-rs/**/*.rs", "**/*.md"]
      pattern: 'https://chatgpt\.com/codex/install\.sh'
      replace: '${install_sh_url}'

    - name: hosted-install-ps1-url
      globs: ["codex-rs/**/*.rs", "**/*.md"]
      pattern: 'https://chatgpt\.com/codex/install\.ps1'
      replace: '${install_ps1_url}'

  # ------------------------------------------------------------------------- npm
  npm:
    - name: npm-package-names
      globs: ["codex-rs/**/*.rs", "codex-rs/**/*.json", "codex-cli/**/*.js", "codex-cli/**/*.json", "codex-cli/**/*.py", "scripts/**/*.py", "scripts/install/*", "**/*.md", ".github/ISSUE_TEMPLATE/*.yml"]
      pattern: '@openai/codex(?![\w])'
      replace: '${npm_package}'

    - name: npm-registry-url
      globs: ["codex-rs/**/*.rs"]
      pattern: '@openai%2fcodex'
      replace: '@ore-cli%2fore'

    - name: npm-bin-entry
      globs: ["codex-cli/package.json"]
      pattern: '"codex": "bin/codex\.js"'
      replace: '"${bin}": "bin/codex.js"'

    - name: npm-shim-exe-name
      note: the vendored package ships bin/ore because targets.py sets executable_stem (series commit).
      globs: ["codex-cli/bin/codex.js"]
      pattern: 'process\.platform === "win32" \? "codex\.exe" : "codex"'
      replace: 'process.platform === "win32" ? "${bin}.exe" : "${bin}"'

    - name: npm-shim-pnpm-path
      note: the scope and name are separate path segments here, so the package-name rule misses it.
      globs: ["codex-cli/bin/codex.js"]
      pattern: 'path\.join\(nodeModulesDir, "@openai", "codex"\)'
      replace: 'path.join(nodeModulesDir, "@ore-cli", "${product}")'

    - name: npm-doctor-package-root
      note: |
        Same split-segment problem as npm-shim-pnpm-path, in Rust. `codex doctor`
        compares the running install against the npm package root it would
        update; built as two joined literals, the package-name rule misses it and
        the check would compare ore against @openai/codex forever -- reporting a
        mismatch on every correctly-installed ore. The test fixtures at the other
        two sites are the same expression, so one rule covers all three.
      globs: ["codex-rs/cli/src/doctor.rs"]
      # The pattern spans code, not a string literal: `.join(` sits between the
      # two literals it joins. Rust files default to substituting inside literal
      # spans only, where this can never match -- and a rule that matches nothing
      # fails --apply, which is how the assembly caught it.
      rust_literals_only: false
      pattern: '\.join\("@openai"\)\.join\("codex"\)'
      replace: '.join("${npm_scope}").join("${product}")'

    - name: npm-staging-repo
      globs: ["scripts/stage_npm_packages.py"]
      pattern: 'GITHUB_REPO = "openai/codex"'
      replace: 'GITHUB_REPO = "${repo_slug}"'

    - name: npm-staging-workflow
      globs: ["scripts/stage_npm_packages.py"]
      pattern: 'WORKFLOW_NAME = "\.github/workflows/rust-release\.yml"'
      replace: 'WORKFLOW_NAME = ".github/workflows/ore-release.yml"'

    - name: npm-staging-tag-prefix
      globs: ["scripts/stage_npm_packages.py"]
      pattern: 'f"rust-v\{version\}"'
      replace: 'f"${tag_prefix}{version}"'

  # ---------------------------------------------------------------- update flows
  update-flows:
    - name: update-brew-command
      globs: ["codex-rs/**/*.rs"]
      rust_literals_only: false
      pattern: '"brew", &\["upgrade", "--cask", "codex"\]'
      replace: '"brew", &["upgrade", "${brew_tap}/${brew_formula}"]'

    - name: update-brew-label
      globs: ["codex-rs/**/*.rs"]
      pattern: 'brew upgrade --cask codex'
      replace: 'brew upgrade ${brew_tap}/${brew_formula}'

    - name: update-tag-prefix-parse
      note: bare prefix, not just the strip_prefix call, so the rust-v1.5.0 test literal in update_versions.rs tracks the prefix the function strips.
      globs: ["codex-rs/tui/src/update_versions.rs", "codex-rs/cli/src/doctor/updates.rs"]
      rust_literals_only: false
      pattern: 'rust-v'
      replace: '${tag_prefix}'

  # ------------------------------------------------------------------ installers
  installers:
    - name: installer-tag-prefix
      globs: ["scripts/install/*"]
      pattern: 'rust-v'
      replace: '${tag_prefix}'

    - name: installer-ps1-prefix-length
      note: "ore-v" is five characters; the legacy fork shipped this off-by-one.
      globs: ["scripts/install/install.ps1"]
      pattern: '\.Substring\(6\)'
      replace: '.Substring(5)'

    - name: installer-releases-base-url
      globs: ["scripts/install/install.sh"]
      pattern: 'RELEASES_BASE_URL="https://releases\.openai\.com/codex"'
      replace: 'RELEASES_BASE_URL=""'

    - name: installer-ps1-releases-base-url
      globs: ["scripts/install/install.ps1"]
      pattern: '\$ReleasesBaseUri = "https://releases\.openai\.com/codex"'
      replace: '$ReleasesBaseUri = ""'

    - name: installer-prefer-github
      globs: ["scripts/install/install.sh"]
      pattern: 'DEFAULT_PREFER_RELEASES_OPENAI_COM="true"'
      replace: 'DEFAULT_PREFER_RELEASES_OPENAI_COM="false"'

    - name: installer-ps1-prefer-github
      globs: ["scripts/install/install.ps1"]
      pattern: '\$DefaultPreferReleasesOpenAICom = \$true'
      replace: '$DefaultPreferReleasesOpenAICom = $false'

    - name: installer-visible-binary
      globs: ["scripts/install/install.sh"]
      pattern: 'BIN_PATH="\$BIN_DIR/codex"'
      replace: 'BIN_PATH="$BIN_DIR/${bin}"'

    - name: installer-entrypoint-paths
      globs: ["scripts/install/install.sh"]
      pattern: '((?:bin|release_dir|stage_release|CURRENT_LINK|current)/)codex(?![\w./-])'
      replace: '\1${bin}'

    - name: installer-ps1-entrypoint-paths
      globs: ["scripts/install/install.ps1"]
      pattern: '(?<![\w.-])codex\.exe'
      replace: '${bin}.exe'

    - name: installer-ps1-programs-dir
      globs: ["scripts/install/install.ps1"]
      pattern: 'Programs\\OpenAI\\(?:Codex|${product_name})'
      replace: 'Programs\\${product_name}'
      optional: true

    - name: installer-brew-uninstall-hint
      globs: ["scripts/install/install.sh"]
      pattern: 'brew uninstall --cask codex'
      replace: 'brew uninstall ${brew_tap}/${brew_formula}'

    - name: installer-command-probe
      globs: ["scripts/install/install.sh"]
      pattern: '(command -v )codex(?![\w./-])'
      replace: '\1${bin}'

  # -------------------------------------------------------------------- DotSlash
  dotslash:
    - name: dotslash-output-name
      globs: [".github/dotslash-config.json"]
      pattern: '"codex": \{'
      replace: '"${bin}": {'

    - name: dotslash-entrypoint-path
      globs: [".github/dotslash-config.json"]
      pattern: '"path": "bin/codex(\.exe)?"'
      replace: '"path": "bin/${bin}\1"'

  # ----------------------------------------------------------------- macOS ident
  macos:
    - name: macos-bundle-id
      note: >
        Two different things share this literal. In cli/src/desktop_app/mac.rs it identifies
        OpenAI's *installed desktop app*, which ore neither ships nor should claim -- excluded.
        In config/src/loader/macos.rs it is ore's own managed-preferences domain, and an admin
        managing ore pushes ore's domain, not OpenAI's; rewriting it is what stops the fork from
        inheriting enterprise policy aimed at Codex.
      globs: ["codex-rs/**/*.rs"]
      exclude: ["codex-rs/cli/src/desktop_app/*"]
      pattern: 'com\.openai\.codex'
      replace: '${bundle_id}'

  # ----------------------------------------------------------------- attribution
  attribution:
    - name: attribution-package-description
      note: model-facing prompt text is deliberately NOT rebranded; see fork/README.
      globs: ["codex-cli/package.json", "**/*.md"]
      pattern: 'a coding agent from OpenAI that runs locally on your computer\.'
      replace: 'a coding agent that runs locally and talks to any OpenAI-compatible endpoint.'

path_moves: []

# Never rewritten.  These are wire identifiers, internal names, layout contracts and
# licences; rewriting any of them breaks sign-in, packaging or upstream tests.
allowlist:
  paths:
    - codex-rs/login/
    - codex-rs/agent-identity/
    - codex-rs/workload-identity/
    - codex-rs/app-server-protocol/
    - codex-rs/protocol/src/auth.rs
    - codex-rs/protocol/src/prompts/
    - codex-rs/model-provider/src/auth.rs
    - codex-rs/model-provider-info/src/lib.rs
    - codex-rs/http-client/src/chatgpt_hosts.rs
    - codex-rs/models-manager/
    - sdk/
    - fork/
    - .github/workflows/
    - LICENSE
    - NOTICE
  literal_prefixes: ["CODEX_", "codex-", "codex_", "codexHome", "codexRateLimits"]
  literals:
    # Names of OpenAI's DESKTOP APP, deliberately left as Codex by the
    # (?<!OpenAI\.) and (?!\.dmg|-latest|/Logs) guards on ui-bare-product-name.
    # These identify a package, a download and a log directory that OpenAI ships;
    # rebranding them renames nothing and yields identifiers that match no install
    # which exists. `ore doctor` uses them to detect an installed Codex desktop
    # app, which is a real thing to detect.
    - OpenAI.Codex
    - Codex.app
    - /Volumes/Codex
    - Codex.dmg
    - Codex-latest-x64.dmg
    - Codex/Logs
    - codex_cli_rs
    - codex_exec
    - codex-tui
    - codex_apps
    - codex-package.json
    - codex-path
    - codex-resources
    - codex-package_SHA256SUMS
    - codex-zsh
    - gpt-5.2-codex
    - Codex Auth
    - .codex
    # Phrases naming OpenAI's products rather than this CLI; rebranding them
    # would make the sentence false, so ui-bare-product-name protects them and
    # the audit must not report them either.
    - Codex Cloud
    - Codex backend
    - Codex App Server
    - Codex app
    - Codex Apps
    - Codex application
    - Codex extension
    - Codex desktop
    - Codex App
    - X-OpenAI-Internal-Codex-Residency
    - client_name

audit:
  cli_subcommands_from: codex-rs/cli/src/main.rs
  allow_paths:
    - codex-rs/app-server-protocol/
    - codex-rs/login/
    - codex-rs/models-manager/
    - codex-rs/protocol/src/prompts/
    - sdk/
    - fork/
    - .github/
    - justfile
    - scripts/codex_package/
    - tools/
    - AGENTS.md
    - CHANGELOG.md
    - codex-rs/vendor/
    # Contributor-only tooling that deliberately installs upstream Codex
    - .devcontainer/
    # Build/config comments that never reach a user
    - MODULE.bazel
    - codex-rs/deny.toml
    - codex-rs/.config/
    - codex-rs/bwrap/
    # Captured upstream model output kept verbatim as a test fixture
    - codex-rs/chatgpt/tests/
    # Names the *installed OpenAI app* in endpoint-security guidance
    - codex-rs/cli/src/doctor/security.rs
    - codex-rs/cli/src/doctor/desktop/
    # Exercises compatibility against *upstream* released binaries by design
    - codex-rs/exec-server/testing/
    # Sample skill that documents OpenAI's own docs surface
    - codex-rs/skills/src/assets/samples/
    # Plugin/OAuth fixtures whose strings are third-party wire values
    - codex-rs/core-plugins/src/agent_plugin_manifest_tests.rs
    - codex-rs/rmcp-client/src/
    # The pet is *named* Codex -- an upstream easter egg the rebrand keeps, so the
    # surrounding prose about "the Codex companion" stays with it.
    - codex-rs/tui/src/pets/
    # Developer smoke-test harness that shells out to a locally built binary
    - codex-rs/windows-sandbox-rs/sandbox_smoketests.py
