# ore rebrand manifest -- rules as data, re-applied from scratch on every sync.
#
# Scope: the OUTWARD-FACING surface only -- what a user types, what they read, and
# where releases come from.  Everything else stays byte-identical to upstream:
# crate names, module paths, helper binaries, internal env vars, wire identifiers,
# the ChatGPT sign-in path, licences, and the package layout names that install.sh,
# DotSlash and the npm staging scripts treat as contracts.
#
# Two hard rules:
#   * In Rust, only string literals and comments are rewritten (never tokens), and
#     format placeholders inside literals are protected.
#   * An enabled rule that matches nothing fails `--apply`: a rule that has gone
#     stale against upstream text is a silent brand leak.
#
# Behaviour lives in the `delta` series, not here.  A series commit that changes
# the text a rule anchors on updates the rule in the same commit.
# `.snap` files are deliberately out of scope: rendered TUI snapshots are
# width-dependent, so they are regenerated by the assemble pass instead.

vars:
  product: ore
  bin: ore
  repo_slug: ore-cli/ore
  npm_scope: "@ore-cli"
  npm_package: "@ore-cli/ore"
  brew_tap: ore-cli/homebrew-tap
  brew_formula: ore
  bundle_id: io.github.ore-cli.ore
  tag_prefix: ore-v
  releases_html: https://github.com/ore-cli/ore/releases/latest
  releases_api: https://api.github.com/repos/ore-cli/ore/releases/latest
  install_sh_url: https://github.com/ore-cli/ore/releases/latest/download/install.sh
  install_ps1_url: https://github.com/ore-cli/ore/releases/latest/download/install.ps1

engine:
  rust_literals_only: true
  skip_dirs: [.git, target, node_modules, __pycache__, .venv, venv, bazel-out, bazel-bin, bazel-testlogs, dist, build, vendor, third_party]
  skip_files: [Cargo.lock, MODULE.bazel.lock, pnpm-lock.yaml, uv.lock, package-lock.json, flake.lock, LICENSE, NOTICE]
  skip_paths:
    - fork/*
    - .github/workflows/*
    - codex-rs/login/*
    - codex-rs/agent-identity/*
    - codex-rs/workload-identity/*
    - codex-rs/app-server-protocol/*
    - codex-rs/protocol/src/auth.rs
    - codex-rs/protocol/src/prompts/*
    - codex-rs/model-provider/src/auth.rs
    - codex-rs/model-provider/src/bearer_auth_provider.rs
    - codex-rs/model-provider-info/src/lib.rs
    - codex-rs/http-client/src/chatgpt_hosts.rs
    - codex-rs/http-client/src/chatgpt_cloudflare_cookies.rs
    - codex-rs/core/config.schema.json
    - codex-rs/hooks/schema/*
    - codex-rs/models-manager/models.json
    - codex-rs/models-manager/prompt.md
    - codex-rs/models-manager/src/model_info.rs
    # Model-facing prompt text, byte-identical by ratified decision 11. These
    # prompts describe the upstream agent TO an OpenAI model, and the model was
    # tuned against that description; rebranding them changes behaviour and
    # makes the text false ("ore CLI is an open source project led by OpenAI",
    # "not the old ore language model built by OpenAI"). The whole prompts crate
    # and the core template trees exist to render text for models.
    - codex-rs/prompts/*
    - codex-rs/core/templates/*
    - codex-rs/core/*prompt*.md
    - codex-rs/core/src/realtime_prompt.rs
    - codex-rs/core/src/guardian/prompt.rs
    # guardian/tests.rs asserts on guardian/prompt.rs's rendered text, and that
    # prompt is skipped just above: its literals ("The Codex agent has requested
    # the following action:", "Reviewed Codex session id:") are copies of the
    # un-rebranded prompt, so rewriting them makes the tests disagree with the
    # very text they assert against. Nothing else in the file is brand text.
    - codex-rs/core/src/guardian/tests.rs
    - codex-rs/tui/prompt_for_init_command.md
    # A five-line README for a crate ore vendors and does not modify. Every
    # "Codex" in it names OpenAI's first-party product, and its issue-tracker
    # link is correct as written: bugs in this crate do belong upstream.
    # Rebranding it produced a sentence that claimed OpenAI maintains ore's
    # fork while pointing users at ore's tracker -- false in both directions.
    # The fork's OWN README, and the one file whose job includes naming upstream
    # correctly. The rebrand turned "a fork of OpenAI Codex" into "a fork of ore"
    # and repointed the attribution link at ore itself. Listed here rather than in
    # skip_files because that matches by basename and would exempt every upstream
    # README in the tree.
    - README.md
    - codex-rs/chatgpt/README.md
    # Test files whose upstream literals are fixtures: the exact bytes are the
    # point, so rewriting them makes the assertions test themselves.
    # info.rs: canonicalize_git_remote_url tests feed deliberately mixed-case,
    # port and scheme variants of ONE GitHub remote and assert they all fold to
    # a single string -- URL shapes under test, not repo coordinates. The rules
    # rewrote them inconsistently ("openai/codex" became the fork slug while
    # "OpenAI/Codex" and ":443/openai/codex" did not), so the variants stopped
    # converging. Cost of the skip: one doc comment keeps "Codex".
    - codex-rs/git-utils/src/info.rs
    # env_detect_tests.rs: git-remote fixtures from which the tests derive the
    # expected by-repo endpoint (".../environments/by-repo/github/openai/codex")
    # and repo hints ("openai/codex"), shapes no URL rule rewrites; rewriting
    # only the remote breaks the derivation. Nothing else in the file is brand
    # text.
    - codex-rs/cloud-tasks/src/env_detect_tests.rs
    - sdk/*
    - .codex/*
  skip_suffixes: [.png, .jpg, .jpeg, .gif, .ico, .woff, .woff2, .zip, .gz, .zst, .snap, .patch]

categories:

  # ---------------------------------------------------------------- CLI identity
  cli-identity:
    - name: clap-program-name
      note: clap renders `--version` from the command name, which defaults to the crate name (codex-cli).
      files: [codex-rs/cli/src/main.rs]
      rust_literals_only: false
      pattern: '(#\[clap\(\n    author,\n    version,)(?!\n    name = )'
      replace: '\1\n    name = "${bin}",\n    display_name = "${bin}",'

    - name: clap-bin-name
      files: [codex-rs/cli/src/main.rs]
      rust_literals_only: false
      pattern: 'bin_name = "codex"'
      replace: 'bin_name = "${bin}"'

    - name: clap-override-usage
      globs: ["codex-rs/**/*.rs"]
      rust_literals_only: false
      pattern: 'override_usage = "codex '
      replace: 'override_usage = "${bin} '

    - name: clap-override-usage-continuation
      files: [codex-rs/cli/src/main.rs]
      rust_literals_only: false
      pattern: '\\n       codex \[OPTIONS\]'
      replace: '\\n       ${bin} [OPTIONS]'

    - name: clap-subcommand-bin-name
      globs: ["codex-rs/**/*.rs"]
      rust_literals_only: false
      pattern: 'bin_name = "codex '
      replace: 'bin_name = "${bin} '

    - name: completion-command-name
      files: [codex-rs/cli/src/main.rs]
      rust_literals_only: false
      pattern: 'let name = "codex";'
      replace: 'let name = "${bin}";'

    - name: doctor-path-probe
      files: [codex-rs/cli/src/doctor.rs]
      rust_literals_only: false
      pattern: '(run_command\("where", \["|run_command\("which", \["-a", ")codex"'
      replace: '\1${bin}"'

    - name: sandbox-version-banner-probe
      note: >
        The sandboxed `--version` banner opens with the clap program name, which
        clap-program-name rebrands, so this assertion must follow; the bare lowercase
        literal matches no other rule. cargo_bin("codex") in the same test stays
        upstream on purpose: the built artifact keeps its crate name.
      files: [codex-rs/cli/tests/sandbox_cloud_config.rs]
      rust_literals_only: false
      pattern: 'starts_with\("codex"\)'
      replace: 'starts_with("${bin}")'

  # ------------------------------------------------------- `codex <sub>` in text
  cli-command-in-text:
    - name: cli-command-in-help-text
      note: subcommand list is re-derived from `enum Subcommand` by --audit; this rule is the bulk rewrite.
      globs: ["codex-rs/**/*.rs", "codex-rs/**/*.txt", "**/*.md", "scripts/**/*.py", "scripts/**/*.sh"]
      pattern: '(?<![\w./-])codex(?= (?:agents|app|app-server|apply|archive|cloud|completion|debug|delete|doctor|exec|exec-server|execpolicy|features|fork|login|logout|mcp|mcp-server|migrate-rollouts|plugin|queue|remote-control|responses-api-proxy|resume|review|sandbox|stdio-to-uds|unarchive|update)\b)'
      replace: '${bin}'

    - name: cli-command-in-backticks
      globs: ["codex-rs/**/*.rs", "**/*.md"]
      pattern: '`codex`'
      replace: '`${bin}`'

    - name: cli-command-before-subcommand-placeholder
      note: >
        `codex {subcommand}` in error messages. Placeholder protection splits the
        literal at {subcommand}, so cli-command-in-help-text's subcommand lookahead
        can never see the word that follows; rewritten as a raw-text rule that names
        the placeholder in the pattern instead.
      files: [codex-rs/cli/src/main.rs]
      rust_literals_only: false
      pattern: '`codex \{subcommand\}`'
      replace: '`${bin} {subcommand}`'

  # ------------------------------------------------------------- display strings
  display-strings:
    - name: ui-openai-codex
      globs: ["codex-rs/**/*.rs", "**/*.md", "*.nix", "codex-rs/**/*.nix"]
      pattern: 'OpenAI Codex'
      replace: '${product}'

    - name: ui-codex-cli-name
      globs: ["codex-rs/**/*.rs", "**/*.md", "codex-cli/**/*.json", "codex-cli/**/*.py", "codex-cli/**/*.js"]
      pattern: '\bCodex CLI\b'
      replace: '${product} CLI'

    - name: ui-tagline
      globs: ["codex-rs/**/*.rs", "**/*.md"]
      pattern: "OpenAI's command-line coding agent"
      replace: 'a command-line coding agent'

    - name: ui-bare-product-name
      note: >
        Rust literals/comments only; the auth fence and wire identifiers are skipped wholesale above.
        The lookahead protects the phrases where "Codex" names OpenAI's service rather than this CLI
        (the ChatGPT backend, the desktop app, the IDE extension, Codex Cloud) -- rebranding those
        would make the text false.  The lookbehind protects a system prompt's opening line wherever
        it is COPIED: the prompt files themselves are skipped above, but test fixtures embed the
        same text, and a fixture that says "You are ore" while the prompt says "You are Codex" is a
        test that fails for the right reason in the most confusing possible way.
      globs: ["codex-rs/**/*.rs", "codex-rs/**/*.js", "codex-rs/**/*.toml", "codex-rs/**/*.txt", "codex-cli/**/*.js", "codex-cli/**/*.json", "**/*.md", "scripts/**/*.py", "scripts/**/*.sh", "scripts/install/*"]
      exclude: ["codex-rs/tui/src/pets/*"]
      pattern: '(?<!You are )\bCodex\b(?! (?:backend|app(?!-)|App|extension|Extension|[Cc]loud))'
      replace: '${product}'

    - name: article-before-product-name
      globs: ["codex-rs/**/*.rs", "**/*.md"]
      pattern: '\ba (ore\b)'
      replace: 'an \1'
      optional: true

    - name: ui-docs-link-probe-range
      note: >
        chatgpt_success_message_renders_osc8_hyperlinks measures the "Codex docs"
        hyperlink cell-by-cell -- 27 dim prefix cells, then the underlined link.
        "ore docs" is 8 columns where "Codex docs" was 10, so the probed range
        (27+10) and the run length shrink with it (precedent:
        installer-ps1-prefix-length).
      files: [codex-rs/tui/src/onboarding/auth.rs]
      rust_literals_only: false
      pattern: '\(0\.\.37\)'
      replace: '(0..35)'

    - name: ui-docs-link-probe-width
      files: [codex-rs/tui/src/onboarding/auth.rs]
      rust_literals_only: false
      pattern: 'Modifier::UNDERLINED; 10\]'
      replace: 'Modifier::UNDERLINED; 8]'

    - name: migration-rewrite-target-fixture
      note: >
        external-agent-migration/src/rewrite.rs maps external-agent terms to the
        product name (rebranded to "ore" by ui-bare-product-name), and this fixture
        holds the expected rewritten AGENTS.md bytes. Between \n escapes the
        escape's own "n" is a word character, so ui-bare-product-name's \bCodex\b
        never fires on the middle occurrences; this rule covers exactly that shape.
      files: [codex-rs/external-agent-migration/src/service_tests/general/repo_import.rs]
      pattern: '(?<=\\n)Codex(?=\\n)'
      replace: '${product}'

  # ------------------------------------------------------------------------ URLs
  urls:
    - name: github-repo-url
      globs: ["codex-rs/**/*.rs", "codex-cli/**/*.js", "codex-cli/**/*.json", "**/*.md", "scripts/**/*.py", "scripts/install/*", ".github/ISSUE_TEMPLATE/*.yml"]
      pattern: 'github\.com/openai/codex'
      replace: 'github.com/${repo_slug}'

    - name: github-api-repo-url
      globs: ["codex-rs/**/*.rs", "scripts/**/*.py", "scripts/install/*"]
      pattern: 'api\.github\.com/repos/openai/codex'
      replace: 'api.github.com/repos/${repo_slug}'

    - name: raw-github-url
      globs: ["codex-rs/**/*.rs", "**/*.md"]
      pattern: 'raw\.githubusercontent\.com/openai/codex'
      replace: 'raw.githubusercontent.com/${repo_slug}'

    - name: developer-docs-url
      note: >
        The trailing path is consumed deliberately. docs/ deep-links into upstream's CLI
        documentation (slash-commands, features), and those pages describe behaviour ore
        does not ship -- analytics on, ~/.codex as the home, a desktop app subcommand.
        Sending ore's users there is worse than sending them to ore's own README.
      globs: ["codex-rs/**/*.rs", "**/*.md"]
      pattern: 'https://developers\.openai\.com/codex/cli[^\s)\]]*'
      replace: 'https://github.com/${repo_slug}#install'

    - name: hosted-install-sh-url
      globs: ["codex-rs/**/*.rs", "**/*.md"]
      pattern: 'https://chatgpt\.com/codex/install\.sh'
      replace: '${install_sh_url}'

    - name: hosted-install-ps1-url
      globs: ["codex-rs/**/*.rs", "**/*.md"]
      pattern: 'https://chatgpt\.com/codex/install\.ps1'
      replace: '${install_ps1_url}'

  # ------------------------------------------------------------------------- npm
  npm:
    - name: npm-package-names
      globs: ["codex-rs/**/*.rs", "codex-rs/**/*.json", "codex-cli/**/*.js", "codex-cli/**/*.json", "codex-cli/**/*.py", "scripts/**/*.py", "scripts/install/*", "**/*.md", ".github/ISSUE_TEMPLATE/*.yml"]
      pattern: '@openai/codex(?![\w])'
      replace: '${npm_package}'

    - name: npm-registry-url
      globs: ["codex-rs/**/*.rs"]
      pattern: '@openai%2fcodex'
      replace: '@ore-cli%2fore'

    - name: npm-bin-entry
      globs: ["codex-cli/package.json"]
      pattern: '"codex": "bin/codex\.js"'
      replace: '"${bin}": "bin/codex.js"'

    - name: npm-shim-exe-name
      note: the vendored package ships bin/ore because targets.py sets executable_stem (series commit).
      globs: ["codex-cli/bin/codex.js"]
      pattern: 'process\.platform === "win32" \? "codex\.exe" : "codex"'
      replace: 'process.platform === "win32" ? "${bin}.exe" : "${bin}"'

    - name: npm-shim-pnpm-path
      note: the scope and name are separate path segments here, so the package-name rule misses it.
      globs: ["codex-cli/bin/codex.js"]
      pattern: 'path\.join\(nodeModulesDir, "@openai", "codex"\)'
      replace: 'path.join(nodeModulesDir, "@ore-cli", "${product}")'

    - name: npm-staging-repo
      globs: ["scripts/stage_npm_packages.py"]
      pattern: 'GITHUB_REPO = "openai/codex"'
      replace: 'GITHUB_REPO = "${repo_slug}"'

    - name: npm-staging-workflow
      globs: ["scripts/stage_npm_packages.py"]
      pattern: 'WORKFLOW_NAME = "\.github/workflows/rust-release\.yml"'
      replace: 'WORKFLOW_NAME = ".github/workflows/ore-release.yml"'

    - name: npm-staging-tag-prefix
      globs: ["scripts/stage_npm_packages.py"]
      pattern: 'f"rust-v\{version\}"'
      replace: 'f"${tag_prefix}{version}"'

  # ---------------------------------------------------------------- update flows
  update-flows:
    - name: update-brew-command
      globs: ["codex-rs/**/*.rs"]
      rust_literals_only: false
      pattern: '"brew", &\["upgrade", "--cask", "codex"\]'
      replace: '"brew", &["upgrade", "${brew_tap}/${brew_formula}"]'

    - name: update-brew-label
      globs: ["codex-rs/**/*.rs"]
      pattern: 'brew upgrade --cask codex'
      replace: 'brew upgrade ${brew_tap}/${brew_formula}'

    - name: update-tag-prefix-parse
      note: bare prefix, not just the strip_prefix call, so the rust-v1.5.0 test literal in update_versions.rs tracks the prefix the function strips.
      globs: ["codex-rs/tui/src/update_versions.rs", "codex-rs/cli/src/doctor/updates.rs"]
      rust_literals_only: false
      pattern: 'rust-v'
      replace: '${tag_prefix}'

  # ------------------------------------------------------------------ installers
  installers:
    - name: installer-tag-prefix
      globs: ["scripts/install/*"]
      pattern: 'rust-v'
      replace: '${tag_prefix}'

    - name: installer-ps1-prefix-length
      note: "ore-v" is five characters; the legacy fork shipped this off-by-one.
      globs: ["scripts/install/install.ps1"]
      pattern: '\.Substring\(6\)'
      replace: '.Substring(5)'

    - name: installer-releases-base-url
      globs: ["scripts/install/install.sh"]
      pattern: 'RELEASES_BASE_URL="https://releases\.openai\.com/codex"'
      replace: 'RELEASES_BASE_URL=""'

    - name: installer-ps1-releases-base-url
      globs: ["scripts/install/install.ps1"]
      pattern: '\$ReleasesBaseUri = "https://releases\.openai\.com/codex"'
      replace: '$ReleasesBaseUri = ""'

    - name: installer-prefer-github
      globs: ["scripts/install/install.sh"]
      pattern: 'DEFAULT_PREFER_RELEASES_OPENAI_COM="true"'
      replace: 'DEFAULT_PREFER_RELEASES_OPENAI_COM="false"'

    - name: installer-ps1-prefer-github
      globs: ["scripts/install/install.ps1"]
      pattern: '\$DefaultPreferReleasesOpenAICom = \$true'
      replace: '$DefaultPreferReleasesOpenAICom = $false'

    - name: installer-visible-binary
      globs: ["scripts/install/install.sh"]
      pattern: 'BIN_PATH="\$BIN_DIR/codex"'
      replace: 'BIN_PATH="$BIN_DIR/${bin}"'

    - name: installer-entrypoint-paths
      globs: ["scripts/install/install.sh"]
      pattern: '((?:bin|release_dir|stage_release|CURRENT_LINK|current)/)codex(?![\w./-])'
      replace: '\1${bin}'

    - name: installer-ps1-entrypoint-paths
      globs: ["scripts/install/install.ps1"]
      pattern: '(?<![\w.-])codex\.exe'
      replace: '${bin}.exe'

    - name: installer-ps1-programs-dir
      globs: ["scripts/install/install.ps1"]
      pattern: 'Programs\\\\OpenAI\\\\Codex'
      replace: 'Programs\\${product}'
      optional: true

    - name: installer-brew-uninstall-hint
      globs: ["scripts/install/install.sh"]
      pattern: 'brew uninstall --cask codex'
      replace: 'brew uninstall ${brew_tap}/${brew_formula}'

    - name: installer-profile-markers
      globs: ["scripts/install/install.sh"]
      pattern: '(# [<>]{3} )Codex( installer)'
      replace: '\1${product}\2'
      optional: true

    - name: installer-command-probe
      globs: ["scripts/install/install.sh"]
      pattern: '(command -v )codex(?![\w./-])'
      replace: '\1${bin}'

  # -------------------------------------------------------------------- DotSlash
  dotslash:
    - name: dotslash-output-name
      globs: [".github/dotslash-config.json"]
      pattern: '"codex": \{'
      replace: '"${bin}": {'

    - name: dotslash-entrypoint-path
      globs: [".github/dotslash-config.json"]
      pattern: '"path": "bin/codex(\.exe)?"'
      replace: '"path": "bin/${bin}\1"'

  # ----------------------------------------------------------------- macOS ident
  macos:
    - name: macos-bundle-id
      note: >
        Two different things share this literal. In cli/src/desktop_app/mac.rs it identifies
        OpenAI's *installed desktop app*, which ore neither ships nor should claim -- excluded.
        In config/src/loader/macos.rs it is ore's own managed-preferences domain, and an admin
        managing ore pushes ore's domain, not OpenAI's; rewriting it is what stops the fork from
        inheriting enterprise policy aimed at Codex.
      globs: ["codex-rs/**/*.rs"]
      exclude: ["codex-rs/cli/src/desktop_app/*"]
      pattern: 'com\.openai\.codex'
      replace: '${bundle_id}'

  # ----------------------------------------------------------------- attribution
  attribution:
    - name: attribution-package-description
      note: model-facing prompt text is deliberately NOT rebranded; see fork/README.
      globs: ["codex-cli/package.json", "**/*.md"]
      pattern: 'a coding agent from OpenAI that runs locally on your computer\.'
      replace: 'a coding agent that runs locally and talks to any OpenAI-compatible endpoint.'

path_moves: []

# Never rewritten.  These are wire identifiers, internal names, layout contracts and
# licences; rewriting any of them breaks sign-in, packaging or upstream tests.
allowlist:
  paths:
    - codex-rs/login/
    - codex-rs/agent-identity/
    - codex-rs/workload-identity/
    - codex-rs/app-server-protocol/
    - codex-rs/protocol/src/auth.rs
    - codex-rs/protocol/src/prompts/
    - codex-rs/model-provider/src/auth.rs
    - codex-rs/model-provider-info/src/lib.rs
    - codex-rs/http-client/src/chatgpt_hosts.rs
    - codex-rs/models-manager/
    - sdk/
    - fork/
    - .github/workflows/
    - LICENSE
    - NOTICE
  literal_prefixes: ["CODEX_", "codex-", "codex_", "codexHome", "codexRateLimits"]
  literals:
    - codex_cli_rs
    - codex_exec
    - codex-tui
    - codex_apps
    - codex-package.json
    - codex-path
    - codex-resources
    - codex-package_SHA256SUMS
    - codex-zsh
    - gpt-5.2-codex
    - Codex Auth
    - .codex
    # Phrases naming OpenAI's products rather than this CLI; rebranding them
    # would make the sentence false, so ui-bare-product-name protects them and
    # the audit must not report them either.
    - Codex Cloud
    - Codex backend
    - Codex App Server
    - Codex app
    - Codex Apps
    - Codex application
    - Codex extension
    - Codex desktop
    - Codex App
    - X-OpenAI-Internal-Codex-Residency
    - client_name

audit:
  cli_subcommands_from: codex-rs/cli/src/main.rs
  allow_paths:
    - codex-rs/app-server-protocol/
    - codex-rs/login/
    - codex-rs/models-manager/
    - codex-rs/protocol/src/prompts/
    - sdk/
    - fork/
    - .github/
    - justfile
    - scripts/codex_package/
    - tools/
    - AGENTS.md
    - CHANGELOG.md
    - codex-rs/vendor/
    # Contributor-only tooling that deliberately installs upstream Codex
    - .devcontainer/
    # Build/config comments that never reach a user
    - MODULE.bazel
    - codex-rs/deny.toml
    - codex-rs/.config/
    - codex-rs/bwrap/
    # Captured upstream model output kept verbatim as a test fixture
    - codex-rs/chatgpt/tests/
    # Names the *installed OpenAI app* in endpoint-security guidance
    - codex-rs/cli/src/doctor/security.rs
    - codex-rs/cli/src/doctor/desktop/
    # Exercises compatibility against *upstream* released binaries by design
    - codex-rs/exec-server/testing/
    # Sample skill that documents OpenAI's own docs surface
    - codex-rs/skills/src/assets/samples/
    # Plugin/OAuth fixtures whose strings are third-party wire values
    - codex-rs/core-plugins/src/agent_plugin_manifest_tests.rs
    - codex-rs/rmcp-client/src/
    # The pet is *named* Codex -- an upstream easter egg the rebrand keeps, so the
    # surrounding prose about "the Codex companion" stays with it.
    - codex-rs/tui/src/pets/
    # Developer smoke-test harness that shells out to a locally built binary
    - codex-rs/windows-sandbox-rs/sandbox_smoketests.py
