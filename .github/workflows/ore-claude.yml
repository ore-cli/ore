# ore-claude: respond to @claude mentions on issues and pull requests.
#
# Fork-owned, so it carries the ore- prefix and is listed in fork/workflows.allow;
# without that entry the relocation pass would move it into
# fork/upstream-workflows/ during assembly and it would never run on main.
#
# Who can trigger it is NOT decided by the `if:` below, which only keeps runners
# from starting on unrelated comments. claude-code-action itself requires the
# triggering user to have write access to the repository and rejects bot actors,
# so a drive-by comment on this public repo cannot start a run. That check asks
# the API for the permission rather than reading author_association, which is the
# field that reads NONE for a maintainer whose org membership is private -- the
# same trap that skipped ore-sync-finalize on the first sync PR.
#
# Claude gets write access through the Claude GitHub App, so CLAUDE.md at the repo
# root is load-bearing here: it is what tells a run that main is generated, that
# delta commits need trailers, and that codex-rs/Cargo.lock is never committed.
# Read it before loosening anything in this file.
name: ore-claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Deny by default; the job grants only what the action documents as required.
permissions: {}

jobs:
  claude:
    name: claude
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
