# ore-sync-finalize: land an approved sync PR by fast-forward.
#
# fork/assemble.sh already wrote the real merge commit M, with parents
# (previous main, upstream tag commit); main must move to EXACTLY that commit.
# The GitHub merge button would mint a fresh merge with different parents --
# breaking main's append-only merge spine and `git log --first-parent` -- so
# landing is a plain fast-forward push of M, after which delta advances to the
# rebased series and the temporary branches are deleted. Every push goes
# through safe_push() and its allowlist.
#
# Fires on an approving review of a `sync`-labelled PR from a sync/<tag>
# branch of this repository, and only when the reviewer has repo standing
# (owner/member/collaborator): on a public repository ANYONE can submit an
# approving review. Pushes authenticate as the ore-sync GitHub App because a
# GITHUB_TOKEN push to main/delta would not trigger ore-ci's push checks.
name: ore-sync-finalize

on:
  pull_request_review:
    types: [submitted]
  # A maintainer who repairs a blocked sync ends up AUTHORING the PR, and GitHub
  # refuses to let an author approve their own -- so the review door is shut in
  # exactly the case that needs it most. This is the same door with the same
  # locks: write access, ore-ci green, and every ancestry check below. It is not
  # a bypass, and merging through GitHub's button is still forbidden -- that
  # makes a fresh merge commit with different parents and breaks main's
  # append-only spine.
  workflow_dispatch:
    inputs:
      pr:
        description: "sync PR number to finalize"
        required: true
        type: string

# Shared with ore-sync.yml: a finalize must never interleave with a sync.
concurrency:
  group: ore-sync
  cancel-in-progress: false

permissions: {}

jobs:
  finalize:
    name: finalize
    # The dispatch path asserts these same conditions in "Resolve the pull
    # request" instead, read from the API rather than an event payload it does
    # not have. Neither door skips any of them.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.review.state == 'approved' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'sync/') &&
      contains(github.event.pull_request.labels.*.name, 'sync'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Mint the ore-sync App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ORE_SYNC_APP_ID }}
          private-key: ${{ secrets.ORE_SYNC_APP_PRIVATE_KEY }}

      # One source of PR facts for both doors. The review path has them in its
      # payload; the dispatch path does not, so they are read from the API and
      # the same conditions the `if:` asserts are re-asserted here. A dispatch
      # that names a PR which is closed, not on main, not a sync/* head, from a
      # fork, or unlabelled fails right here.
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          json="$(gh api "repos/$REPO/pulls/$NUM")"
          state=$(jq -r .state <<<"$json")
          base=$(jq -r .base.ref <<<"$json")
          head_ref=$(jq -r .head.ref <<<"$json")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$json")
          head_sha=$(jq -r .head.sha <<<"$json")
          labels=$(jq -r '[.labels[].name] | join(",")' <<<"$json")

          fail() { echo "::error::PR #$NUM $1"; exit 1; }
          [ "$state" = "open" ]              || fail "is '$state', not open"
          [ "$base" = "main" ]               || fail "targets '$base', not main"
          [ "$head_repo" = "$REPO" ]         || fail "head is on '$head_repo', not $REPO"
          case "$head_ref" in sync/*) ;; *) fail "head '$head_ref' is not a sync/* branch" ;; esac
          case ",$labels," in *,sync,*) ;; *) fail "is not labelled 'sync' (has: $labels)" ;; esac

          {
            echo "number=$NUM"
            echo "head_ref=$head_ref"
            echo "sha=$head_sha"
          } >>"$GITHUB_OUTPUT"
          echo "PR #$NUM: $head_ref @ $head_sha"

      # author_association is computed for the viewer of the payload, so a
      # reviewer whose organization membership is private arrives as NONE even
      # when they administer the repository -- which is what skipped this job on
      # the first sync PR. Ask the API for the permission instead: accurate, and
      # unaffected by membership visibility.
      - name: Require the reviewer to have write access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVIEWER: ${{ github.event.review.user.login || github.actor }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          perm="$(gh api "repos/$REPO/collaborators/$REVIEWER/permission" --jq .permission)"
          case "$perm" in
            admin|maintain|write) echo "reviewer $REVIEWER has '$perm'" ;;
            *) echo "::error::$REVIEWER has '$perm' on $REPO; finalize needs write"; exit 1 ;;
          esac

      # finalize fast-forwards main, and ore-release runs no tests of its own, so
      # without this one approving review is enough to ship a red tree.
      - name: Require ore-ci green on the reviewed commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          M: ${{ steps.pr.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          concl="$(gh api "repos/$REPO/commits/$M/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "required")] | last | .conclusion // "missing"')"
          if [ "$concl" != "success" ]; then
            echo "::error::ore-ci 'required' on $M is '$concl', not success"
            exit 1
          fi
          echo "ore-ci required: success on $M"

      # ref: main, not the PR merge ref -- the job only needs the object
      # database plus origin/* refs, and a merge ref does not exist when the
      # PR conflicts.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fast-forward main, advance delta, drop the temp branches
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          M: ${{ steps.pr.outputs.sha }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          tag="${HEAD_REF#sync/}"

          # A second approval after finalize already ran: nothing to do.
          if git merge-base --is-ancestor "$M" refs/remotes/origin/main 2>/dev/null; then
            echo "already finalized: main contains $M"
            exit 0
          fi

          # The approval reviewed M; refuse anything that moved since.
          if ! cur="$(git rev-parse --verify --quiet "refs/remotes/origin/$HEAD_REF")"; then
            echo "::error::$HEAD_REF no longer exists on origin and main does not contain $M"
            exit 1
          fi
          if [ "$cur" != "$M" ]; then
            echo "::error::$HEAD_REF moved since the approved review ($M -> $cur); re-review and re-approve"
            exit 1
          fi

          if ! git merge-base --is-ancestor refs/remotes/origin/main "$M"; then
            echo "::error::origin/main is not an ancestor of $M -- the candidate was built against an older main; close this PR and re-run ore-sync"
            exit 1
          fi

          delta_new="$(git rev-parse --verify --quiet "refs/remotes/origin/sync-delta/$tag")" \
            || { echo "::error::sync-delta/$tag does not exist on origin"; exit 1; }

          . fork/lib.sh
          # Push credentials exist only in this step's environment.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0

          # No force flag: git refuses anything but a fast-forward here.
          safe_push "$M:refs/heads/main"

          # Give GitHub a moment to notice that main now contains the head
          # commit and mark the PR merged before its head branch disappears.
          sleep 20

          safe_push --force-with-lease "$delta_new:refs/heads/delta"
          safe_push --delete "refs/heads/sync/$tag" "refs/heads/sync-delta/$tag"

          echo "finalized: main -> $M; delta -> $delta_new" | tee -a "$GITHUB_STEP_SUMMARY"
